name: ci

# Manual only: run from the Actions tab ("Run workflow") or `gh workflow run ci --ref <branch>`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  lint-typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:drift

  unit:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Both read committed evidence; neither runs `pnpm measure` (R34).
      - run: pnpm test:perf
      - run: pnpm test:matrix
      - run: pnpm check:matrix

  browser:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # The gating step: every browser regression fails here, whatever the visual state.
      - run: pnpm exec playwright test --project=browser
      # The `visual` project compares against the owner-approved baselines in
      # tests/visual/baselines/approved (D4, R41) in the full Chromium (`channel: 'chromium'`, R46).
      # Red here, with the step above green, means a pixel difference or, on a new runner image,
      # different font rasterization (the baselines may then need owner re-approval).
      - run: pnpm exec playwright test --project=visual

  # Packs the library and checks it as a consumer: test:package (React 18/19/core consumers, Vite,
  # publint, attw) and test:dist (dist declarations, no eval, asset manifest, Node import and
  # stage checks, which test:package does not cover).
  package:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # test:package runs Playwright smoke tests (React consumers, plain-HTML examples).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:package
      - run: pnpm test:dist

  docs:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:docs && pnpm test:docs

  # Packs the library, prints a real A4 PDF through DravenPDF (uv, Python 3.12, Chromium) and
  # checks it. Required. Exit 3 (prerequisites missing) and exit 4 (probe unverified) are
  # UNVERIFIED: they fail the job with an annotation and are never a pass.
  pdf:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv python install 3.12
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: echo "PW_CHROMIUM_PATH=$HOME/.cache/ms-playwright/chromium-1194/chrome-linux/chrome" >> "$GITHUB_ENV"
      - name: pnpm test:pdf
        run: |
          set +e
          pnpm test:pdf
          code=$?
          if [ "$code" -eq 3 ] || [ "$code" -eq 4 ]; then
            echo "::error title=UNVERIFIED::test:pdf exited $code; the PDF path is UNVERIFIED, not a pass"
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-evidence
          path: evidence/pdf
